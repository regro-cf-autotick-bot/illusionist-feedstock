{% set name = "illusionist" %}
{% set version = "0.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/illusionist-{{ version }}.tar.gz
  sha256: c6a906216705b3b56aaa9e3ceeb4e24671f5b7497bb7058fb4a4d7b12f897f05

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry
  run:
    - python >={{ python_min }},<4.0
    - ipywidgets >=7.6.5,<8.0.0
    - nbclient >=0.5.0
    - nbconvert >=6.2.0,<7
    - nbformat >=5.0.7
    - structlog >=21.1.0,<22.0.0

test:
  imports:
    - illusionist
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/danielfrg/illusionist
  summary: Interactive Jupyter Widgets without a Kernel
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - ocefpaf
